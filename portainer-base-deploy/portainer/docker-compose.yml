version: '3.8'

services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./ssl:/certs:ro
      - portainer_data:/data
    ports:
      - "9000:9000"
      - "9443:9443"
    command: --sslcert /certs/portainer.crt --sslkey /certs/portainer.key
    networks:
      - portainer_network

  # Optional: Portainer Agent for remote Docker environments
  # Uncomment the section below if you need to manage remote Docker hosts
  # portainer_agent:
  #   image: portainer/agent:latest
  #   container_name: portainer_agent
  #   restart: unless-stopped
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #     - /var/lib/docker/volumes:/var/lib/docker/volumes
  #   ports:
  #     - "9001:9001"
  #   networks:
  #     - portainer_network

volumes:
  portainer_data:
    driver: local

networks:
  portainer_network:
    driver: bridge
